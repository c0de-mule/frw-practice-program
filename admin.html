<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FRW — Results (internal)</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{--navy:#142433;--navy2:#1B2F42;--ink:#22303C;--ink-soft:#4A5866;--ink-faint:#7A8794;
    --paper:#F7F5F1;--card:#FFFFFF;--line:#E3DFD8;--attune:#176C9B;--explore:#B26A22;--lead:#3C7A55;
    --gold:#D8C58C;--good:#2E7D4F;--bad:#B04A3A;
    --ui:"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif;--serif:Georgia,"Times New Roman",serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);line-height:1.5}
  .brand{background:var(--navy);color:#fff;padding:.85rem 1.4rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
  .brand b{font-weight:600;letter-spacing:.02em}
  .brand .tag{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  .wrap{max-width:1000px;margin:0 auto;padding:1.6rem 1.2rem 4rem}
  h1{font-family:var(--serif);font-weight:500;color:var(--navy);font-size:1.7rem;margin:.2rem 0 .3rem}
  .sub{color:var(--ink-soft);margin:0 0 1.4rem;font-size:.95rem}

  /* gate */
  #gate{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
  #gate .c{max-width:400px;width:100%;text-align:center}
  #gate .eye{letter-spacing:.2em;text-transform:uppercase;font-size:.7rem;color:var(--ink-faint);margin:0 0 .5rem}
  #gate h2{font-family:var(--serif);color:var(--navy);font-size:1.6rem;margin:0 0 .4rem}
  #gate p{color:var(--ink-soft);font-size:.9rem;margin:0 0 1.2rem}
  #gate input{width:100%;padding:.8rem 1rem;border:1px solid var(--line);border-radius:10px;font-size:1rem;font-family:var(--ui);background:#fff;margin-bottom:.7rem}
  #gate input:focus{outline:2px solid var(--attune);outline-offset:1px;border-color:var(--attune)}
  #gate button{width:100%;padding:.8rem;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;font-family:var(--ui)}
  #gate .msg{min-height:1.1rem;font-size:.85rem;color:var(--bad);margin-top:.7rem}

  /* summary cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin:0 0 1.6rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem 1.15rem}
  .card .n{font-family:var(--serif);font-size:1.9rem;color:var(--navy);line-height:1}
  .card .l{font-size:.78rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;margin-top:.35rem}

  /* view toggle */
  .tabs{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.2rem;margin:0 0 1.1rem}
  .tabs button{border:0;background:none;padding:.5rem .95rem;border-radius:8px;font-family:var(--ui);font-size:.9rem;color:var(--ink-soft);cursor:pointer;font-weight:600}
  .tabs button.on{background:var(--navy);color:#fff}

  /* tester table */
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:.7rem .85rem;font-size:.9rem;border-bottom:1px solid var(--line)}
  th{background:#FBFAF7;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:700}
  tr:last-child td{border-bottom:0}
  .person{cursor:pointer}
  .person:hover{background:#FBFAF7}
  .person td .nm{font-weight:600;color:var(--navy)}
  .person td .em{color:var(--ink-faint);font-size:.8rem}
  .tiertrack{display:flex;gap:.3rem}
  .tiertrack span{font-size:.72rem;padding:.12rem .4rem;border-radius:5px;background:#F0ECE4;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .acc{font-variant-numeric:tabular-nums;font-weight:600}
  .tag{display:inline-block;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;background:#EFEAE0;color:var(--ink-faint);padding:.1rem .4rem;border-radius:4px;margin-left:.4rem;vertical-align:middle}
  .caret{color:var(--ink-faint);font-size:.8rem}
  .detail td{background:#FBFAF7;padding:0}
  .detail .inner{padding:1rem 1.1rem 1.3rem}
  .tierblock{margin:0 0 1rem}
  .tierblock h4{margin:.2rem 0 .5rem;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em}
  .picks{display:flex;flex-wrap:wrap;gap:.3rem}
  .pick{font-size:.74rem;font-variant-numeric:tabular-nums;padding:.18rem .42rem;border-radius:5px;border:1px solid var(--line);background:#fff}
  .pick.ok{border-color:rgba(46,125,79,.4);color:var(--good)}
  .pick.no{border-color:rgba(176,74,58,.4);color:var(--bad)}
  .own{margin:.6rem 0 0;padding:.6rem .8rem;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:.88rem}
  .own .q{font-size:.72rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.2rem}
  .own p{margin:.1rem 0 0;font-family:var(--serif)}
  .muted{color:var(--ink-faint);font-size:.85rem}

  /* by-item */
  .itemrow{display:grid;grid-template-columns:3rem 1fr 4.5rem;gap:.7rem;align-items:center;padding:.4rem .2rem;border-bottom:1px solid var(--line);font-size:.85rem}
  .itemrow .ix{font-variant-numeric:tabular-nums;color:var(--ink-faint)}
  .dist{display:flex;height:16px;border-radius:4px;overflow:hidden;background:#F0ECE4}
  .dist .seg{display:flex;align-items:center;justify-content:center;font-size:.62rem;color:#fff;font-weight:700}
  .seg.a{background:var(--attune)}.seg.b{background:var(--explore)}.seg.c{background:var(--lead)}.seg.d{background:#6b5ca0}
  .itemrow .ar{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .legend{font-size:.78rem;color:var(--ink-soft);margin:.3rem 0 1rem}
  .legend b{color:var(--ink)}
  .err{background:#fbece9;border:1px solid var(--bad);color:var(--bad);padding:.8rem 1rem;border-radius:10px;font-size:.9rem}
  .foot{margin-top:2rem;font-size:.78rem;color:var(--ink-faint);line-height:1.6}
  .logout{background:none;border:0;color:var(--attune);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
</style>
</head>
<body>

<div id="gate">
  <div class="c">
    <p class="eye">Finding the Right Words</p>
    <h2>Results — internal</h2>
    <p>For the program team. Enter your admin email to view tester results.</p>
    <input id="gmail" type="email" placeholder="you@example.com" autocomplete="email">
    <button id="gbtn">View results</button>
    <div class="msg" id="gmsg"></div>
  </div>
</div>

<div class="brand"><b>The Right Words</b><span class="tag">Results · internal</span></div>
<div class="wrap" id="app" style="display:none">
  <h1>Tester results</h1>
  <p class="sub" id="asub">Live progress synced from the Practice Program.</p>

  <div class="cards" id="cards"></div>

  <div class="tabs">
    <button id="tab-people" class="on">By tester</button>
    <button id="tab-items">By item</button>
  </div>

  <div id="view-people"></div>
  <div id="view-items" style="display:none"></div>

  <div class="foot" id="foot"></div>
</div>

<script>
const SB_URL  = 'https://cidmtwedjspatzadacor.supabase.co';
const SB_ANON = 'sb_publishable_IArlQ_Wgb-9mwokBxbccVg_Jcym3nSe';
const ADMIN = ['everett@innersource.net','amber@theakcollective.com'];
const DEMO  = ['buyer@example.com','test@example.com'];
const TIERS = [
  {k:'read',   n:1, label:'Sensing the Direction',      color:'var(--attune)'},
  {k:'phrase', n:2, label:'Shaping the Phrase',         color:'var(--explore)'},
  {k:'twin',   n:3, label:'Sophisticated Discernment',  color:'var(--lead)'}
];
const PER_TIER = 48, TOTAL = 144;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const letter=i=>String.fromCharCode(65+(+i||0));
let ROWS=[];

/* ---- gate ---- */
function showApp(){ document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='block'; load(); }
function tryGate(){
  const v=(document.getElementById('gmail').value||'').trim().toLowerCase();
  if(ADMIN.includes(v)){ try{sessionStorage.setItem('frw_admin',v);}catch(e){} showApp(); }
  else document.getElementById('gmsg').textContent='That email is not on the results-access list.';
}
document.getElementById('gbtn').addEventListener('click',tryGate);
document.getElementById('gmail').addEventListener('keydown',e=>{if(e.key==='Enter')tryGate();});
try{ if(ADMIN.includes((sessionStorage.getItem('frw_admin')||'').toLowerCase())) showApp(); }catch(e){}

/* ---- data ---- */
async function load(){
  const pv=document.getElementById('view-people');
  pv.innerHTML='<p class="muted">Loading…</p>';
  try{
    const r=await fetch(SB_URL+'/rest/v1/frw_progress?select=*',{headers:{apikey:SB_ANON,Authorization:'Bearer '+SB_ANON}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    ROWS=await r.json();
  }catch(e){
    pv.innerHTML='<div class="err">Could not load results: '+esc(e.message)+'</div>'; return;
  }
  ROWS.sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at));
  renderCards(); renderPeople(); renderItems();
  const admin=(sessionStorage.getItem('frw_admin')||'');
  document.getElementById('foot').innerHTML=
    'Signed in as <b>'+esc(admin)+'</b> · <button class="logout" onclick="sessionStorage.removeItem(\'frw_admin\');location.reload()">Log out</button><br>'
    +'Reads live progress from Supabase. Note: access here is a soft email check — treat the data as internal and don\'t share this link widely.';
}

function personStats(row){
  const prog=(row.payload&&row.payload.progress)||{};
  let answered=0,correct=0,score=0;
  const tiers=TIERS.map(t=>{
    const m=prog[t.k]||{};
    const cor=(m.correct||[]).length, mis=(m.missed||[]).length;
    answered+=cor+mis; correct+=cor; score+=(+m.score||0);
    return {t, m, cor, mis, ans:cor+mis, done:!!m.done, pos:+m.pos||0};
  });
  return {name:(row.payload&&row.payload.name)||'', email:row.email, when:row.updated_at,
          answered, correct, score, acc:answered?Math.round(correct/answered*100):null, tiers,
          demo:DEMO.includes(row.email)};
}

function renderCards(){
  const ppl=ROWS.map(personStats).filter(p=>!p.demo);
  const started=ppl.filter(p=>p.answered>0).length;
  const totAns=ppl.reduce((s,p)=>s+p.answered,0);
  const totCor=ppl.reduce((s,p)=>s+p.correct,0);
  const acc=totAns?Math.round(totCor/totAns*100):0;
  const cards=[[ROWS.length,'Accounts synced'],[started,'Started answering'],[totAns,'Answers recorded'],[acc+'%','Overall accuracy']];
  document.getElementById('cards').innerHTML=cards.map(c=>'<div class="card"><div class="n">'+c[0]+'</div><div class="l">'+c[1]+'</div></div>').join('');
}

function fmtDate(s){ try{ return new Date(s).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }catch(e){ return s; } }

function renderPeople(){
  const rows=ROWS.map(personStats);
  if(!rows.length){ document.getElementById('view-people').innerHTML='<p class="muted">No tester data yet.</p>'; return; }
  let h='<table><thead><tr><th>Tester</th><th>Progress (per tier)</th><th>Answered</th><th>Accuracy</th><th>Last active</th><th></th></tr></thead><tbody>';
  rows.forEach((p,i)=>{
    const track=p.tiers.map(t=>'<span title="Tier '+t.t.n+' · '+t.t.label+'">T'+t.t.n+' '+t.ans+'/'+PER_TIER+'</span>').join('');
    h+='<tr class="person" onclick="toggle('+i+')">'
      +'<td><span class="nm">'+(esc(p.name)||'<span class="muted">(no name)</span>')+'</span>'+(p.demo?'<span class="tag">demo</span>':'')+'<br><span class="em">'+esc(p.email)+'</span></td>'
      +'<td><div class="tiertrack">'+track+'</div></td>'
      +'<td>'+p.answered+' <span class="muted">/ '+TOTAL+'</span></td>'
      +'<td>'+(p.acc==null?'<span class="muted">—</span>':'<span class="acc">'+p.acc+'%</span> <span class="muted">('+p.correct+'/'+p.answered+')</span>')+'</td>'
      +'<td class="muted">'+fmtDate(p.when)+'</td>'
      +'<td class="caret" id="caret-'+i+'">▸</td></tr>'
      +'<tr class="detail" id="det-'+i+'" style="display:none"><td colspan="6"><div class="inner" id="inner-'+i+'"></div></td></tr>';
  });
  h+='</tbody></table>';
  document.getElementById('view-people').innerHTML=h;
}

function toggle(i){
  const d=document.getElementById('det-'+i), c=document.getElementById('caret-'+i);
  const open=d.style.display==='none';
  d.style.display=open?'table-row':'none'; c.textContent=open?'▾':'▸';
  if(open && !d.dataset.built){ d.dataset.built='1'; document.getElementById('inner-'+i).innerHTML=buildDetail(personStats(ROWS[i])); }
}

function buildDetail(p){
  let h='';
  p.tiers.forEach(t=>{
    const m=t.m, picks=m.picks||{}, own=m.own||{};
    const keys=Object.keys(picks).map(Number).sort((a,b)=>a-b);
    h+='<div class="tierblock"><h4 style="color:'+t.t.color+'">Tier '+t.t.n+' · '+t.t.label
      +' <span class="muted" style="font-weight:400;text-transform:none;letter-spacing:0">— '+t.ans+'/'+PER_TIER+' answered, '+t.cor+' correct'+(m.done?', finished':'')+'</span></h4>';
    if(!keys.length){ h+='<p class="muted">No answers yet.</p>'; }
    else{
      h+='<div class="picks">'+keys.map(k=>{
        const ok=(m.correct||[]).indexOf(k)>-1, bad=(m.missed||[]).indexOf(k)>-1;
        const cls=ok?'ok':(bad?'no':'');
        return '<span class="pick '+cls+'" title="Item '+(k+1)+'">#'+(k+1)+' '+letter(picks[k])+(ok?' ✓':(bad?' ✗':''))+'</span>';
      }).join('')+'</div>';
    }
    const ownKeys=Object.keys(own).filter(k=>own[k]&&(own[k].p||'').trim());
    if(ownKeys.length){
      h+=ownKeys.map(k=>'<div class="own"><div class="q">Own phrase · item '+(Number(k)+1)+'</div><p>“'+esc(own[k].p)+'”</p></div>').join('');
    }
    h+='</div>';
  });
  return h||'<p class="muted">No detail.</p>';
}

/* ---- by item: answer distribution across all (non-demo) testers ---- */
function renderItems(){
  const v=document.getElementById('view-items');
  const ppl=ROWS.map(personStats).filter(p=>!p.demo);
  let anyData=false, h='';
  TIERS.forEach(t=>{
    const agg={}; // itemIdx -> {opts:{optIdx:count}, correct:count, total:count}
    ppl.forEach(p=>{
      const m=(ROWS.find(r=>r.email===p.email).payload.progress||{})[t.k]||{};
      const picks=m.picks||{}, cor=m.correct||[];
      Object.keys(picks).forEach(k=>{
        k=+k; agg[k]=agg[k]||{opts:{},correct:0,total:0};
        agg[k].opts[picks[k]]=(agg[k].opts[picks[k]]||0)+1;
        agg[k].total++; if(cor.indexOf(k)>-1) agg[k].correct++;
      });
    });
    const items=Object.keys(agg).map(Number).sort((a,b)=>a-b);
    if(!items.length) return;
    anyData=true;
    h+='<h3 style="font-family:var(--serif);font-weight:500;color:var(--navy);margin:1.4rem 0 .2rem">Tier '+t.n+' · '+t.label+'</h3>';
    h+='<div class="legend">Each bar = how testers answered that item. <b>Green/orange/teal</b> = option A/B/C chosen. Right column = share who got it right.</div>';
    items.forEach(ix=>{
      const a=agg[ix], segs=Object.keys(a.opts).map(Number).sort((x,y)=>x-y);
      const bar=segs.map(o=>{
        const pct=Math.round(a.opts[o]/a.total*100);
        const cl=['a','b','c','d'][o]||'d';
        return '<div class="seg '+cl+'" style="width:'+pct+'%" title="Option '+letter(o)+': '+a.opts[o]+'">'+(pct>=16?letter(o):'')+'</div>';
      }).join('');
      const accP=Math.round(a.correct/a.total*100);
      h+='<div class="itemrow"><div class="ix">#'+(ix+1)+'</div><div class="dist">'+bar+'</div>'
        +'<div class="ar">'+accP+'%<br><span class="muted" style="font-weight:400;font-size:.72rem">'+a.total+' ans</span></div></div>';
    });
  });
  v.innerHTML=anyData?h:'<p class="muted">No answers recorded yet — the item breakdown appears once testers start choosing.</p>';
}

/* tabs */
function setTab(which){
  const p=which==='people';
  document.getElementById('view-people').style.display=p?'block':'none';
  document.getElementById('view-items').style.display=p?'none':'block';
  document.getElementById('tab-people').classList.toggle('on',p);
  document.getElementById('tab-items').classList.toggle('on',!p);
}
document.getElementById('tab-people').addEventListener('click',()=>setTab('people'));
document.getElementById('tab-items').addEventListener('click',()=>setTab('items'));
</script>
</body>
</html>
